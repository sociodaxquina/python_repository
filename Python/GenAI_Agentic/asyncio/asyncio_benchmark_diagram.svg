<svg width="680" height="385" viewBox="0 0 680 385" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Wall-clock timelines for the three benchmark strategies</title>
<desc>Sync and sequential await each run ten tasks end to end for one second. Gather runs them overlapped in one tenth of a second on I/O work, but falls back to one second on CPU work.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #3d3d3a; }
  .ts { font-size: 12px; font-weight: 400; fill: #73726c; }
  .axis { stroke: #73726c; stroke-width: 0.5; }
  .r-gray  { fill: #F1EFE8; stroke: #5F5E5A; }
  .r-teal  { fill: #E1F5EE; stroke: #0F6E56; }
  .r-coral { fill: #FAECE7; stroke: #993C1D; }
  .t-gray  { fill: #444441; }
  .t-coral { fill: #712B13; }
  @media (prefers-color-scheme: dark) {
    .th { fill: #c2c0b6; }
    .ts { fill: #9c9a92; }
    .axis { stroke: #9c9a92; }
    .r-gray  { fill: #444441; stroke: #B4B2A9; }
    .r-teal  { fill: #085041; stroke: #5DCAA5; }
    .r-coral { fill: #712B13; stroke: #F0997B; }
    .t-gray  { fill: #D3D1C7; }
    .t-coral { fill: #F5C4B3; }
  }
</style>

<text class="th" x="170" y="48">sync, I/O-bound</text>
<text class="ts" x="640" y="48" text-anchor="end">1.00 s</text>
<rect class="r-gray" x="170" y="58" width="90" height="26" rx="4" stroke-width="0.5"/>
<rect class="r-gray" x="264" y="58" width="90" height="26" rx="4" stroke-width="0.5"/>
<rect class="r-gray" x="358" y="58" width="90" height="26" rx="4" stroke-width="0.5"/>
<rect class="r-gray" x="452" y="58" width="90" height="26" rx="4" stroke-width="0.5"/>
<rect class="r-gray" x="546" y="58" width="90" height="26" rx="4" stroke-width="0.5"/>
<text class="ts t-gray" x="215" y="71" text-anchor="middle" dominant-baseline="central">wait</text>
<text class="ts t-gray" x="309" y="71" text-anchor="middle" dominant-baseline="central">wait</text>
<text class="ts t-gray" x="403" y="71" text-anchor="middle" dominant-baseline="central">wait</text>
<text class="ts t-gray" x="497" y="71" text-anchor="middle" dominant-baseline="central">wait</text>
<text class="ts t-gray" x="591" y="71" text-anchor="middle" dominant-baseline="central">wait</text>

<text class="th" x="170" y="112">sequential await, I/O-bound</text>
<text class="ts" x="640" y="112" text-anchor="end">1.00 s</text>
<rect class="r-gray" x="170" y="122" width="90" height="26" rx="4" stroke-width="0.5"/>
<rect class="r-gray" x="264" y="122" width="90" height="26" rx="4" stroke-width="0.5"/>
<rect class="r-gray" x="358" y="122" width="90" height="26" rx="4" stroke-width="0.5"/>
<rect class="r-gray" x="452" y="122" width="90" height="26" rx="4" stroke-width="0.5"/>
<rect class="r-gray" x="546" y="122" width="90" height="26" rx="4" stroke-width="0.5"/>
<text class="ts t-gray" x="215" y="135" text-anchor="middle" dominant-baseline="central">wait</text>
<text class="ts t-gray" x="309" y="135" text-anchor="middle" dominant-baseline="central">wait</text>
<text class="ts t-gray" x="403" y="135" text-anchor="middle" dominant-baseline="central">wait</text>
<text class="ts t-gray" x="497" y="135" text-anchor="middle" dominant-baseline="central">wait</text>
<text class="ts t-gray" x="591" y="135" text-anchor="middle" dominant-baseline="central">wait</text>

<text class="th" x="170" y="176">asyncio.gather, I/O-bound</text>
<text class="ts" x="640" y="176" text-anchor="end">0.10 s</text>
<rect class="r-teal" x="170" y="186" width="47" height="11" rx="3" stroke-width="0.5"/>
<rect class="r-teal" x="170" y="200" width="47" height="11" rx="3" stroke-width="0.5"/>
<rect class="r-teal" x="170" y="214" width="47" height="11" rx="3" stroke-width="0.5"/>
<rect class="r-teal" x="170" y="228" width="47" height="11" rx="3" stroke-width="0.5"/>
<rect class="r-teal" x="170" y="242" width="47" height="11" rx="3" stroke-width="0.5"/>
<text class="ts" x="229" y="220" dominant-baseline="central">all waits overlap</text>

<text class="th" x="170" y="281">asyncio.gather, CPU-bound</text>
<text class="ts" x="640" y="281" text-anchor="end">1.00 s</text>
<rect class="r-coral" x="170" y="291" width="90" height="26" rx="4" stroke-width="0.5"/>
<rect class="r-coral" x="264" y="291" width="90" height="26" rx="4" stroke-width="0.5"/>
<rect class="r-coral" x="358" y="291" width="90" height="26" rx="4" stroke-width="0.5"/>
<rect class="r-coral" x="452" y="291" width="90" height="26" rx="4" stroke-width="0.5"/>
<rect class="r-coral" x="546" y="291" width="90" height="26" rx="4" stroke-width="0.5"/>
<text class="ts t-coral" x="215" y="304" text-anchor="middle" dominant-baseline="central">busy</text>
<text class="ts t-coral" x="309" y="304" text-anchor="middle" dominant-baseline="central">busy</text>
<text class="ts t-coral" x="403" y="304" text-anchor="middle" dominant-baseline="central">busy</text>
<text class="ts t-coral" x="497" y="304" text-anchor="middle" dominant-baseline="central">busy</text>
<text class="ts t-coral" x="591" y="304" text-anchor="middle" dominant-baseline="central">busy</text>

<line class="axis" x1="170" y1="345" x2="640" y2="345"/>
<line class="axis" x1="170" y1="340" x2="170" y2="350"/>
<line class="axis" x1="217" y1="340" x2="217" y2="350"/>
<line class="axis" x1="640" y1="340" x2="640" y2="350"/>
<text class="ts" x="170" y="365" text-anchor="middle">0 s</text>
<text class="ts" x="217" y="365" text-anchor="middle">0.1 s</text>
<text class="ts" x="640" y="365" text-anchor="end">1.0 s</text>
</svg>
